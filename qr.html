<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR-коды для столов — BURGER LAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/qr.css" />
  </head>
  <body>
    <div class="panel no-print">
      <h1>QR-коды для столов</h1>
      <p>Укажите адрес опубликованного меню и количество столов. Каждый QR ведёт в меню с номером стола.</p>
      <label>Адрес меню <input id="url" type="url" /></label>
      <label>Количество столов <input id="count" type="number" min="1" max="200" value="12" /></label>
      <div class="actions">
        <button id="gen">Сгенерировать</button>
        <button id="print">Печать</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <script type="module" src="/src/qr.js"></script>
  </body>
</html>
